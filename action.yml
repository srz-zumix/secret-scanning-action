name: 'Local Secret Scanning Action'
description: 'Scan local git content for secrets with gh-secure-kit and optionally install pre-commit / pre-push hooks'
author: 'srz-zumix'
inputs:
  args:
    description: "Additional arguments passed to 'gh-secure-kit secret-scanning local check'"
    default: ''
    required: false
  hooks:
    description: 'Optional git hooks to install before scanning (pre-commit, pre-push). Separate values with spaces, commas, or newlines.'
    default: ''
    required: false
  hook-force:
    description: 'Overwrite an existing hook even if it was not generated by gh-secure-kit'
    default: false
    type: boolean
    required: false
  hook-backup:
    description: 'Back up an existing hook before replacing it'
    default: false
    type: boolean
    required: false
  working-directory:
    description: 'Directory where the scan and optional hook installation run'
    default: '.'
    required: false
  cache:
    description: 'Whether or not to use aqua install cache'
    default: true
    type: boolean
    required: false
runs:
  using: 'composite'
  steps:
    - uses: srz-zumix/aqua-installer-cache@ac75fd8ae6d84e379f31f58bea79c04e24fe80cc # v1.0.0
      id: aqua-cache
      with:
        working-directory: ${{ github.action_path }}
        config-file: aqua.yaml
      if: inputs.cache == 'true'
    - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
      with:
        aqua_version: v2.55.3
        working_directory: ${{ github.action_path }}
    - name: gh-secure-kit path
      id: gh-secure-kit
      shell: bash
      env:
        GH_HOST: github.com
        GH_ENTERPRISE_TOKEN: ''
        AQUA_POLICY_CONFIG: aqua-policy.yaml
      run: |
        set -euo pipefail
        export GH_TOKEN="${AQUA_GITHUB_TOKEN:-}"
        gh-secure-kit --version
        echo "path=$(aqua which gh-secure-kit)" >> "${GITHUB_OUTPUT}"
      working-directory: ${{ github.action_path }}
    - name: Local secret scan
      id: secret-scan
      shell: bash
      env:
        INPUTS_ARGS: ${{ inputs.args }}
        INPUTS_HOOKS: ${{ inputs.hooks }}
        INPUTS_HOOK_FORCE: ${{ inputs.hook-force }}
        INPUTS_HOOK_BACKUP: ${{ inputs.hook-backup }}
        GH_SECURE_KIT: ${{ steps.gh-secure-kit.outputs.path }}
      run: |
        set -euo pipefail

        HOOK_OPTIONS=()
        HOOKS=()
        if [ -n "${INPUTS_HOOKS}" ]; then
          while read -r hook; do
            [ -n "${hook}" ] || continue
            case "${hook}" in
              pre-commit|pre-push) ;;
              *)
                echo "::error::unsupported hook '${hook}'. Supported hooks: pre-commit, pre-push"
                exit 1
                ;;
            esac
            HOOKS+=("${hook}")
          done < <(printf '%s' "${INPUTS_HOOKS}" | tr ',\r\n\t' '    ' | xargs -n1 printf '%s\n')
        fi

        if [ "${INPUTS_HOOK_FORCE}" = 'true' ]; then
          HOOK_OPTIONS+=(--force)
        fi
        if [ "${INPUTS_HOOK_BACKUP}" = 'true' ]; then
          HOOK_OPTIONS+=(--backup)
        fi
        if [ ${#HOOKS[@]} -gt 0 ]; then
          set -x
          "${GH_SECURE_KIT}" secret-scanning local hook install \
            ${HOOK_OPTIONS[@]+"${HOOK_OPTIONS[@]}"} \
            "${HOOKS[@]}"
          set +x
        fi

        CHECK_OPTIONS=()
        if [ -n "${INPUTS_ARGS}" ]; then
          read -r -a CHECK_OPTIONS <<< "$(printf '%s' "${INPUTS_ARGS}" | tr '\r\n' '  ')"
        fi

        set -x
        "${GH_SECURE_KIT}" secret-scanning local check \
          ${CHECK_OPTIONS[@]+"${CHECK_OPTIONS[@]}"}
      working-directory: ${{ inputs.working-directory }}
branding:
  icon: 'shield'
  color: 'red'
