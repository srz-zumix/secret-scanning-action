name: Self Test
on:
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  test-staged-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cache: [true, false]
    steps:
      - uses: actions/checkout@v5
        with:
          path: secret-scanning-action
          persist-credentials: false
      - name: Create staged secret fixture
        run: |
          rm -rf secret-scanning-action/.git
          git init /tmp/local-scan-repo
          cd /tmp/local-scan-repo
          git config user.name test
          git config user.email test@example.com
          echo clean > README.md
          git add README.md
          git commit -m init
          printf 'token=ghp_%s\n' "$(printf 'A%.0s' {1..36})" > secret.txt
          git add secret.txt
      - name: Run secret scan
        id: staged-scan
        continue-on-error: true
        uses: ./secret-scanning-action
        with:
          working-directory: /tmp/local-scan-repo
          args: --staged
          cache: ${{ matrix.cache }}
      - name: Verify staged secret was detected
        env:
          OUTCOME: ${{ steps.staged-scan.outcome }}
        run: test "${OUTCOME}" = failure

  test-hook-install:
    name: test-hook-install (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - id: with-scan
            hooks: |
              pre-commit
              pre-push
            args: --staged
            run-scan: true
          - id: hooks-only
            hooks: pre-push
            args: ''
            run-scan: false
    steps:
      - uses: actions/checkout@v5
        with:
          path: secret-scanning-action
          persist-credentials: false
      - name: Create clean repository
        run: |
          rm -rf secret-scanning-action/.git
          git init /tmp/hook-repo
          cd /tmp/hook-repo
          git config user.name test
          git config user.email test@example.com
          echo clean > README.md
          git add README.md
          git commit -m init
      - name: Install hooks
        uses: ./secret-scanning-action
        with:
          working-directory: /tmp/hook-repo
          hooks: ${{ matrix.hooks }}
          args: ${{ matrix.args }}
          run-scan: ${{ matrix.run-scan }}
      - name: Verify hooks were installed
        env:
          HOOKS: ${{ matrix.hooks }}
        run: |
          hooks_dir=$(git -C /tmp/hook-repo rev-parse --git-path hooks)
          for hook in ${HOOKS}; do
            test -x "${hooks_dir}/${hook}"
            grep -q 'secret-scanning local check' "${hooks_dir}/${hook}"
            [ "${hook}" != pre-commit ] || grep -q 'secret-scanning local check --staged' "${hooks_dir}/${hook}"
          done

  ci-status-check:
    runs-on: ubuntu-latest
    needs:
      - test-staged-scan
      - test-hook-install
    if: failure()
    steps:
      - name: CI Status Check Failed
        run: exit 1
